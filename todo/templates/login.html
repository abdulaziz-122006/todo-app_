<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kirish | Todo app</title>
    <meta name="description" content="Todo app — Hisobga kirish.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --r-3xl: 28px;
            --r-2xl: 22px;
            --r-xl: 16px;
            --r-lg: 12px;
            --transition-smooth: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* DARK THEME (Matching Right Side of Screenshot) */
        [data-theme="dark"] {
            --bg-page: #080c14;
            --bg-gradient: radial-gradient(circle at 50% 0%, #111827 0%, #080c14 70%, #030712 100%);
            --glass-bg: rgba(22, 27, 38, 0.65);
            --glass-bg-hover: rgba(28, 34, 48, 0.75);
            --glass-bg-subtle: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-border-highlight: rgba(255, 255, 255, 0.22);
            --glass-shadow: 0 20px 50px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.14);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-tertiary: #64748b;
            --accent-ring: #38bdf8;
            --accent-bg: rgba(56, 189, 248, 0.15);
            --input-bg: rgba(15, 20, 30, 0.65);
            --leaf-color: #1e293b;
            --orb-1: radial-gradient(circle, rgba(56, 189, 248, 0.18) 0%, transparent 70%);
            --orb-2: radial-gradient(circle, rgba(99, 102, 241, 0.16) 0%, transparent 70%);
        }

        /* LIGHT THEME (Matching Left Side of Screenshot) */
        [data-theme="light"] {
            --bg-page: #e8ecf4;
            --bg-gradient: radial-gradient(circle at 50% 0%, #f4f6fa 0%, #e8edf5 50%, #dfe5ef 100%);
            --glass-bg: rgba(255, 255, 255, 0.62);
            --glass-bg-hover: rgba(255, 255, 255, 0.8);
            --glass-bg-subtle: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.85);
            --glass-border-highlight: rgba(255, 255, 255, 1);
            --glass-shadow: 0 16px 45px rgba(100, 116, 139, 0.12), inset 0 1px 1px rgba(255, 255, 255, 0.95);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-tertiary: #94a3b8;
            --accent-ring: #0284c7;
            --accent-bg: rgba(2, 132, 199, 0.12);
            --input-bg: rgba(255, 255, 255, 0.7);
            --leaf-color: #8da48f;
            --orb-1: radial-gradient(circle, rgba(186, 230, 253, 0.6) 0%, transparent 70%);
            --orb-2: radial-gradient(circle, rgba(224, 231, 255, 0.55) 0%, transparent 70%);
        }

        html, body { height: 100%; }

        body {
            font-family: var(--font-main);
            background: var(--bg-page);
            color: var(--text-primary);
            display: flex; align-items: center; justify-content: center;
            padding: 24px 16px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            transition: background 0.4s ease, color 0.4s ease;
        }

        /* AMBIENT BACKGROUND */
        .ambient-bg {
            position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
            background: var(--bg-gradient);
        }
        .ambient-orb {
            position: absolute; border-radius: 50%; filter: blur(80px);
            opacity: 0.85; animation: ambientFloat 18s ease-in-out infinite alternate;
        }
        .orb-1 { width: 480px; height: 480px; top: -140px; left: -100px; background: var(--orb-1); }
        .orb-2 { width: 420px; height: 420px; bottom: -100px; right: -80px; background: var(--orb-2); animation-delay: -7s; }

        @keyframes ambientFloat {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -20px) scale(1.05); }
            100% { transform: translate(-20px, 20px) scale(0.96); }
        }

        /* BOTANICAL LEAF SILHOUETTE */
        .botanical-leaf {
            position: fixed; pointer-events: none; z-index: 0; opacity: 0.38;
        }
        .leaf-left { bottom: -20px; left: -20px; width: 200px; height: 300px; transform: rotate(-10deg); }
        .leaf-right { bottom: -30px; right: -20px; width: 220px; height: 320px; transform: scaleX(-1) rotate(-15deg); }

        /* THEME TOGGLE FLOATING */
        .theme-toggle-top {
            position: fixed; top: 20px; right: 20px; z-index: 10;
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow); backdrop-filter: blur(28px);
            color: var(--text-primary); cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 16px; transition: var(--transition-smooth);
        }
        .theme-toggle-top:hover { transform: scale(1.1); }

        /* In Light Mode: Left leaf is bright and visible */
        [data-theme="light"] .leaf-left { opacity: 0.85; filter: drop-shadow(0 12px 24px rgba(100, 116, 139, 0.15)); }
        [data-theme="light"] .leaf-right { opacity: 0; pointer-events: none; }

        /* In Dark Mode: Right leaf is dark and visible */
        [data-theme="dark"] .leaf-left { opacity: 0; pointer-events: none; }
        [data-theme="dark"] .leaf-right { opacity: 0.65; filter: drop-shadow(0 12px 30px rgba(0, 0, 0, 0.6)); }

        .theme-mode-segmented {
            display: inline-flex; align-items: center;
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
            border-radius: 30px; padding: 4px; box-shadow: var(--glass-shadow); gap: 4px;
            margin-bottom: 16px;
        }
        .mode-tab {
            display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px;
            border-radius: 20px; font-size: 12.5px; font-weight: 700; font-family: inherit;
            border: none; cursor: pointer; background: transparent; color: var(--text-secondary);
            transition: var(--transition-smooth);
        }
        .mode-tab:hover { color: var(--text-primary); }
        .mode-tab.active { background: var(--text-primary); color: var(--bg-page); box-shadow: 0 4px 14px rgba(0,0,0,0.2); }

        /* CARD */
        .glass-auth-card {
            position: relative; z-index: 1;
            width: 100%; max-width: 420px;
            background: var(--glass-bg);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: var(--r-3xl);
            box-shadow: var(--glass-shadow);
            overflow: hidden;
            animation: cardEnter 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }
        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .glass-auth-card::before {
            content: ''; position: absolute;
            top: 0; left: 10%; right: 10%; height: 1px;
            background: linear-gradient(90deg, transparent, var(--glass-border-highlight), transparent);
            pointer-events: none; z-index: 2;
        }

        .auth-header {
            padding: 34px 28px 22px; text-align: center;
            border-bottom: 1px solid var(--glass-border);
        }
        .auth-logo-badge {
            width: 58px; height: 58px; border-radius: 18px; margin: 0 auto 16px;
            background: var(--glass-bg-subtle); border: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center;
            box-shadow: var(--glass-shadow);
        }
        .auth-logo-svg {
            width: 26px; height: 26px; stroke: var(--text-primary); fill: none; stroke-width: 2;
        }
        .auth-title {
            font-size: 22px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.4px;
        }
        .auth-subtitle {
            font-size: 13px; color: var(--text-secondary); margin-top: 4px;
        }

        .auth-body { padding: 24px 28px 28px; }

        /* ALERTS */
        .alert-box {
            padding: 10px 14px; border-radius: var(--r-lg); font-size: 12.5px; font-weight: 500;
            margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
        }
        .alert-error { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; }
        .alert-success { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); color: #34d399; }

        .field-wrap { margin-bottom: 16px; }
        .field-label {
            display: block; font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.6px; color: var(--text-tertiary); margin-bottom: 6px;
        }
        .glass-input {
            width: 100%; padding: 13px 16px;
            background: var(--input-bg); border: 1px solid var(--glass-border);
            border-radius: var(--r-xl); color: var(--text-primary); font-family: inherit; font-size: 14px;
            outline: none; transition: var(--transition-smooth);
        }
        .glass-input:focus {
            border-color: var(--accent-ring); box-shadow: 0 0 0 3px var(--accent-bg);
        }

        .checkbox-row {
            display: flex; align-items: center; gap: 8px; margin-bottom: 20px;
        }
        .checkbox-input {
            width: 18px; height: 18px; accent-color: var(--accent-ring); cursor: pointer;
        }
        .checkbox-text {
            font-size: 12.5px; color: var(--text-secondary); cursor: pointer;
        }

        .btn-submit {
            width: 100%; padding: 14px; border-radius: var(--r-xl);
            background: var(--text-primary); color: var(--bg-page);
            font-size: 14.5px; font-weight: 700; font-family: inherit;
            border: none; cursor: pointer; transition: var(--transition-smooth);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }
        .btn-submit:hover { transform: translateY(-2px); opacity: 0.92; }

        .auth-footer {
            padding: 16px 28px 22px; text-align: center;
            border-top: 1px solid var(--glass-border); font-size: 13px; color: var(--text-secondary);
        }
        .auth-link {
            color: var(--accent-ring); font-weight: 700; text-decoration: none; margin-left: 4px;
        }
        .auth-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <!-- AMBIENT BACKGROUND -->
    <div class="ambient-bg">
        <div class="ambient-orb orb-1"></div>
        <div class="ambient-orb orb-2"></div>

        <svg class="botanical-leaf leaf-left" viewBox="0 0 200 300" fill="currentColor" style="color: var(--leaf-color);">
            <path d="M10,290 C50,240 80,180 90,100 C95,60 110,20 120,5 C118,30 110,70 100,120 C130,90 160,80 180,85 C160,110 130,130 95,145 C120,150 150,165 165,185 C140,195 110,185 88,175 C95,205 110,235 125,255 C100,250 85,230 80,205 C75,240 55,270 10,290 Z"/>
        </svg>
        <svg class="botanical-leaf leaf-right" viewBox="0 0 200 300" fill="currentColor" style="color: var(--leaf-color);">
            <path d="M10,290 C50,240 80,180 90,100 C95,60 110,20 120,5 C118,30 110,70 100,120 C130,90 160,80 180,85 C160,110 130,130 95,145 C120,150 150,165 165,185 C140,195 110,185 88,175 C95,205 110,235 125,255 C100,250 85,230 80,205 C75,240 55,270 10,290 Z"/>
        </svg>
    </div>

    <!-- MAIN WRAPPER WITH THEME SWITCHER -->
    <div style="display:flex; flex-direction:column; align-items:center; width:100%; max-width:420px; z-index:2; position:relative;">
        <div class="theme-mode-segmented">
            <button type="button" class="mode-tab" id="auth-mode-light" onclick="setAuthTheme('light')">
                <span>☀️ Light Mode</span>
            </button>
            <button type="button" class="mode-tab active" id="auth-mode-dark" onclick="setAuthTheme('dark')">
                <span>🌙 Dark Mode</span>
            </button>
        </div>

        <!-- CARD -->
        <div class="glass-auth-card">
            <div class="auth-header">
                <div class="auth-logo-badge">
                    <svg class="auth-logo-svg" viewBox="0 0 24 24">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                <h1 class="auth-title">Hisobga kirish</h1>
                <p class="auth-subtitle">Todo app</p>
            </div>

            <div class="auth-body">
                {% if messages %}
                    {% for message in messages %}
                    <div class="alert-box {% if message.tags == 'error' %}alert-error{% else %}alert-success{% endif %}">
                        <span>{% if message.tags == 'error' %}⚠️{% else %}✅{% endif %}</span>
                        <span>{{ message }}</span>
                    </div>
                    {% endfor %}
                {% endif %}

                <form action="{% url 'login' %}" method="POST">
                    {% csrf_token %}

                    <div class="field-wrap">
                        <label class="field-label" for="username">Foydalanuvchi nomi</label>
                        <input type="text" id="username" name="username" required
                               class="glass-input" placeholder="username" autocomplete="username">
                    </div>

                    <div class="field-wrap">
                        <label class="field-label" for="password">Parol</label>
                        <input type="password" id="password" name="password" required
                               class="glass-input" placeholder="••••••••" autocomplete="current-password">
                    </div>

                    <div class="checkbox-row">
                        <input type="checkbox" id="remember_me" name="remember_me" checked class="checkbox-input">
                        <label for="remember_me" class="checkbox-text">Meni eslab qolish (30 kun)</label>
                    </div>

                    <button type="submit" class="btn-submit">Kirish</button>
                </form>
            </div>

            <div class="auth-footer">
                <span>Profilingiz yo'qmi?</span>
                <a href="{% url 'register' %}" class="auth-link">Ro'yxatdan o'tish</a>
            </div>
        </div>
    </div>

    <script>
        function setAuthTheme(mode) {
            document.documentElement.setAttribute('data-theme', mode);
            localStorage.setItem('todo_theme', mode);
            const lightBtn = document.getElementById('auth-mode-light');
            const darkBtn = document.getElementById('auth-mode-dark');
            if (lightBtn && darkBtn) {
                if (mode === 'light') {
                    lightBtn.classList.add('active');
                    darkBtn.classList.remove('active');
                } else {
                    darkBtn.classList.add('active');
                    lightBtn.classList.remove('active');
                }
            }
        }
        function initAuthTheme() {
            const saved = localStorage.getItem('todo_theme') || 'dark';
            setAuthTheme(saved);
        }
        initAuthTheme();
    </script>
</body>
</html>
